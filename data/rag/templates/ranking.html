<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; }
  body {
    font-family: "Meiryo", "Yu Gothic", sans-serif;
    background: linear-gradient(160deg, #2b1763 0%, #7b2f8f 55%, #c0397a 100%);
    color: #fff; display: flex; flex-direction: column;
    align-items: center; padding: 56px 46px 40px;
  }
  .kicker { font-size: 30px; font-weight: bold; letter-spacing: 5px; opacity: .9; }
  .title { font-size: 72px; font-weight: 900; margin-top: 8px; line-height: 1.06;
    text-align: center; text-shadow: 0 4px 18px rgba(0,0,0,.3); }
  .date { font-size: 34px; font-weight: bold; margin-top: 8px; opacity: .95;
    background: rgba(255,255,255,.16); border-radius: 999px; padding: 8px 28px; }
  .list { width: 100%; margin-top: 26px; display: flex; flex-direction: column; gap: 10px; }
  .item { display: flex; align-items: center; gap: 18px;
    background: rgba(255,255,255,.10); border-radius: 20px; padding: 14px 22px; }
  .item.top { background: rgba(255,255,255,.96); color: #2b1763; }
  .rank { font-size: 34px; font-weight: 900; width: 106px; text-align: center;
    flex: none; white-space: nowrap; }
  .item.top .rank { color: #c0397a; }
  .medal { font-size: 46px; width: 106px; text-align: center; flex: none; }
  .sym { font-size: 38px; width: 50px; text-align: center; flex: none; opacity: .9; }
  .nm { font-size: 34px; font-weight: 900; width: 200px; flex: none; }
  .cm { font-size: 27px; line-height: 1.3; flex: 1; opacity: .96; }
  .item.top .cm { opacity: 1; }
  .combo { width: 100%; margin-top: 18px;
    background: rgba(255,235,120,.95); color: #5a3d00; border-radius: 22px;
    padding: 22px 30px; text-align: center; }
  .combo .h { font-size: 30px; font-weight: 900; margin-bottom: 6px; }
  .combo .b { font-size: 38px; font-weight: 900; }
  .combo .s { font-size: 26px; margin-top: 6px; opacity: .85; }
  .foot { font-size: 28px; opacity: .92; margin-top: 16px; }
</style>
</head>
<body>
  <div class="kicker">&#11088; 今日の運勢</div>
  <div class="title">12星座ランキング</div>
  <div class="date">{{DATE}}</div>
  <div class="list">{{ROWS}}</div>
  <div class="combo">
    <div class="h">&#128081; 今日の最強相性ペア</div>
    <div class="b">{{COMBO}}</div>
    <div class="s">{{COMBO_SUB}}</div>
  </div>
  <div class="foot">あなたは何位だった？コメントで教えてね</div>
</body>
</html>
