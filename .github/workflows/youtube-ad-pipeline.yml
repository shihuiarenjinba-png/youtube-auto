name: Advertising Pipeline - Safe Validation

on:
  push:
    branches:
      - codex/port-proven-uploader
      - codex/social-post-reconciliation
    paths:
      - test-triggers/phase-b.txt
      - test-triggers/phase-c-instagram.txt
      - test-triggers/phase-c-tiktok.txt
      - test-triggers/safety-only.txt
      - test-triggers/reconcile-instagram.txt
      - test-triggers/reconcile-tiktok.txt
  workflow_dispatch:
    inputs:
      market:
        description: "Strict advertising market namespace"
        required: true
        type: choice
        options: [jp, us]
      mode:
        description: "Read-only or no-post validation only"
        required: true
        default: advertising-oauth-check
        type: choice
        options:
          - advertising-oauth-check
          - advertising-oauth-discovery
          - rag-dry-run
          - app-campaign-rag-dry-run
          - social-check
          - social-post-reconcile
      campaign_id:
        description: "Required only for rag-dry-run"
        required: false
        type: string
      source_url:
        description: "Public HTTPS source; required only for rag-dry-run"
        required: false
        type: string
      social_platform:
        description: "Platform for read-only reconciliation of an existing social post"
        required: false
        type: choice
        options: [instagram, tiktok]
      social_account_id:
        description: "Existing advertising account ID for the selected platform"
        required: false
        type: string
      social_post_id:
        description: "Existing Zernio post ID; read-only lookup only"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: advertising-safe-${{ inputs.market }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          requests beautifulsoup4 google-api-python-client google-auth
      - name: Run fail-closed tests
        run: python -m unittest discover -s tests -v

  advertising-jp-oauth-read-only:
    needs: safety-tests
    if: inputs.mode == 'advertising-oauth-check' && inputs.market == 'jp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth
      - name: Verify advertising.jp OAuth identity without writing
        env:
          AD_YOUTUBE_CLIENT_ID_JP: ${{ secrets.AD_YOUTUBE_CLIENT_ID_JP }}
          AD_YOUTUBE_CLIENT_SECRET_JP: ${{ secrets.AD_YOUTUBE_CLIENT_SECRET_JP }}
          AD_YOUTUBE_REFRESH_TOKEN_JP: ${{ secrets.AD_YOUTUBE_REFRESH_TOKEN_JP }}
        run: python scripts/audit_advertising_youtube.py --market jp

  advertising-us-oauth-read-only:
    needs: safety-tests
    if: (inputs.mode == 'advertising-oauth-check' || inputs.mode == 'advertising-oauth-discovery') && inputs.market == 'us'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth
      - name: Discover or verify advertising.us OAuth identity without writing
        env:
          AD_YOUTUBE_CLIENT_ID_US: ${{ secrets.AD_YOUTUBE_CLIENT_ID_US }}
          AD_YOUTUBE_CLIENT_SECRET_US: ${{ secrets.AD_YOUTUBE_CLIENT_SECRET_US }}
          AD_YOUTUBE_REFRESH_TOKEN_US: ${{ secrets.AD_YOUTUBE_REFRESH_TOKEN_US }}
        run: |
          if [ "${{ inputs.mode }}" = "advertising-oauth-discovery" ]; then
            python scripts/audit_advertising_youtube.py --market us --discover
          else
            python scripts/audit_advertising_youtube.py --market us
          fi

  rag-dry-run:
    needs: safety-tests
    if: inputs.mode == 'rag-dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Fetch source and generate grounded review without posting
        env:
          MARKET: ${{ inputs.market }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: >-
          python scripts/run_advertising_rag.py
          --market "$MARKET"
          --campaign-id "$CAMPAIGN_ID"
          --source-url "$SOURCE_URL"

  app-campaign-rag-dry-run:
    needs: safety-tests
    if: inputs.mode == 'app-campaign-rag-dry-run' && inputs.market == 'jp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Build grounded Daymark AI Campaign review without posting
        run: >-
          python scripts/run_app_campaign_rag.py
          --dataset data/app_campaigns/daymark-ai-jp.json
          --output "$RUNNER_TEMP/daymark-ai-jp-review.json"
      - name: Remove temporary Campaign review
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/daymark-ai-jp-review.json"
          test ! -e "$RUNNER_TEMP/daymark-ai-jp-review.json"

  social-jp-read-only:
    needs: safety-tests
    if: inputs.mode == 'social-check' && inputs.market == 'jp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Read JP Instagram and TikTok health/capacity only
        env:
          ZERNIO_API_KEY_1: ${{ secrets.ZERNIO_API_KEY_JP_1 }}
          ZERNIO_API_KEY_2: ${{ secrets.ZERNIO_API_KEY_JP_2 }}
        run: python scripts/check_social_accounts.py --language ja

  social-us-read-only:
    needs: safety-tests
    if: inputs.mode == 'social-check' && inputs.market == 'us'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Read US Instagram and TikTok health/capacity only
        env:
          ZERNIO_API_KEY_1: ${{ secrets.ZERNIO_API_KEY_US_1 }}
        run: python scripts/check_social_accounts.py --language en



  social-jp-instagram-historical-reconcile:
    needs: safety-tests
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[reconcile-instagram]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Read-only lookup of the existing JP Instagram Daymark post
        env:
          ZERNIO_API_KEY_1: ${{ secrets.ZERNIO_API_KEY_JP_1 }}
        run: >-
          python scripts/reconcile_advertising_social_posts.py
          --language ja
          --platform instagram
          --account-id 6a9799d277555aae01bd18c1
          --post-id 6b01ebac9cb6859183df64b6
          --allow-account-id-omission

  social-jp-tiktok-historical-reconcile:
    needs: safety-tests
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[reconcile-tiktok]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Read-only lookup of the existing JP TikTok Daymark post
        env:
          ZERNIO_API_KEY_1: ${{ secrets.ZERNIO_API_KEY_JP_1 }}
        run: >-
          python scripts/reconcile_advertising_social_posts.py
          --language ja
          --platform tiktok
          --account-id 6a97712377555aae01bbe410
          --post-id 6b01ec79154e1268344ff4eb
          --allow-account-id-omission

  social-jp-post-reconcile:
    needs: safety-tests
    if: inputs.mode == 'social-post-reconcile' && inputs.market == 'jp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Reconcile one existing JP social post without writing
        env:
          ZERNIO_API_KEY_1: ${{ secrets.ZERNIO_API_KEY_JP_1 }}
          ZERNIO_API_KEY_2: ${{ secrets.ZERNIO_API_KEY_JP_2 }}
        run: >-
          python scripts/reconcile_advertising_social_posts.py
          --language ja
          --platform "${{ inputs.social_platform }}"
          --account-id "${{ inputs.social_account_id }}"
          --post-id "${{ inputs.social_post_id }}"

  social-us-post-reconcile:
    needs: safety-tests
    if: inputs.mode == 'social-post-reconcile' && inputs.market == 'us'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Reconcile one existing US social post without writing
        env:
          ZERNIO_API_KEY_1: ${{ secrets.ZERNIO_API_KEY_US_1 }}
        run: >-
          python scripts/reconcile_advertising_social_posts.py
          --language en
          --platform "${{ inputs.social_platform }}"
          --account-id "${{ inputs.social_account_id }}"
          --post-id "${{ inputs.social_post_id }}"

  phase-b-daymark-media-transfer:
    needs: safety-tests
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[phase-b]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install app-ad dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Generate grounded Daymark ad and transfer media only
        env:
          ZERNIO_API_KEY_1: ${{ secrets.ZERNIO_API_KEY_JP_1 }}
        run: >-
          python scripts/transfer_app_campaign_media.py
          --dataset data/app_campaigns/daymark-ai-jp.json
      - name: Assert no retained media
        if: always()
        run: |
          test ! -d "$RUNNER_TEMP/daymark-phase-b"

  phase-c-daymark-instagram-controlled-post:
    needs: safety-tests
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[phase-c-instagram]')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install controlled-post dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Post one grounded Daymark test to one JP Instagram account
        env:
          ZERNIO_API_KEY_1: ${{ secrets.ZERNIO_API_KEY_JP_1 }}
        run: >-
          python scripts/post_app_campaign_instagram_test.py
          --dataset data/app_campaigns/daymark-ai-jp.json
          --platform instagram
          --account-id 6a9799d277555aae01bd18c1
      - name: Assert no retained controlled-post media
        if: always()
        run: |
          test ! -d "$RUNNER_TEMP/daymark-phase-c-instagram"

  phase-c-daymark-tiktok-controlled-post:
    needs: safety-tests
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[phase-c-tiktok]')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install controlled-post dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Post one grounded Daymark test to one JP TikTok account
        env:
          ZERNIO_API_KEY_1: ${{ secrets.ZERNIO_API_KEY_JP_1 }}
        run: >-
          python scripts/post_app_campaign_instagram_test.py
          --dataset data/app_campaigns/daymark-ai-jp.json
          --platform tiktok
          --account-id 6a97712377555aae01bbe410
      - name: Assert no retained controlled-post media
        if: always()
        run: |
          test ! -d "$RUNNER_TEMP/daymark-phase-c-instagram"
