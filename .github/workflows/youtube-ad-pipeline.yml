name: Advertising Pipeline - Safe Validation

on:
  workflow_dispatch:
    inputs:
      market:
        description: "Strict advertising market namespace"
        required: true
        type: choice
        options: [jp, us]
      mode:
        description: "Read-only or no-post validation only"
        required: true
        default: advertising-oauth-check
        type: choice
        options:
          - advertising-oauth-check
          - rag-dry-run
          - app-campaign-rag-dry-run
          - social-check
      campaign_id:
        description: "Required only for rag-dry-run"
        required: false
        type: string
      source_url:
        description: "Public HTTPS source; required only for rag-dry-run"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: advertising-safe-${{ inputs.market }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          requests beautifulsoup4 google-api-python-client google-auth
      - name: Run fail-closed tests
        run: python -m unittest discover -s tests -v

  advertising-jp-oauth-read-only:
    needs: safety-tests
    if: inputs.mode == 'advertising-oauth-check' && inputs.market == 'jp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth
      - name: Verify advertising.jp OAuth identity without writing
        env:
          AD_YOUTUBE_CLIENT_ID_JP: ${{ secrets.AD_YOUTUBE_CLIENT_ID_JP }}
          AD_YOUTUBE_CLIENT_SECRET_JP: ${{ secrets.AD_YOUTUBE_CLIENT_SECRET_JP }}
          AD_YOUTUBE_REFRESH_TOKEN_JP: ${{ secrets.AD_YOUTUBE_REFRESH_TOKEN_JP }}
        run: python scripts/audit_advertising_youtube.py --market jp

  advertising-us-oauth-read-only:
    needs: safety-tests
    if: inputs.mode == 'advertising-oauth-check' && inputs.market == 'us'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth
      - name: Fail closed until advertising.us channel identity is confirmed
        env:
          AD_YOUTUBE_CLIENT_ID_US: ${{ secrets.AD_YOUTUBE_CLIENT_ID_US }}
          AD_YOUTUBE_CLIENT_SECRET_US: ${{ secrets.AD_YOUTUBE_CLIENT_SECRET_US }}
          AD_YOUTUBE_REFRESH_TOKEN_US: ${{ secrets.AD_YOUTUBE_REFRESH_TOKEN_US }}
        run: python scripts/audit_advertising_youtube.py --market us

  rag-dry-run:
    needs: safety-tests
    if: inputs.mode == 'rag-dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Fetch source and generate grounded review without posting
        env:
          MARKET: ${{ inputs.market }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: >-
          python scripts/run_advertising_rag.py
          --market "$MARKET"
          --campaign-id "$CAMPAIGN_ID"
          --source-url "$SOURCE_URL"

  app-campaign-rag-dry-run:
    needs: safety-tests
    if: inputs.mode == 'app-campaign-rag-dry-run' && inputs.market == 'jp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Build grounded Daymark AI Campaign review without posting
        run: >-
          python scripts/run_app_campaign_rag.py
          --dataset data/app_campaigns/daymark-ai-jp.json
          --output "$RUNNER_TEMP/daymark-ai-jp-review.json"
      - name: Remove temporary Campaign review
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/daymark-ai-jp-review.json"
          test ! -e "$RUNNER_TEMP/daymark-ai-jp-review.json"

  social-jp-read-only:
    needs: safety-tests
    if: inputs.mode == 'social-check' && inputs.market == 'jp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Read JP Instagram and TikTok health/capacity only
        env:
          ZERNIO_API_KEY_1: ${{ secrets.ZERNIO_API_KEY_JP_1 }}
          ZERNIO_API_KEY_2: ${{ secrets.ZERNIO_API_KEY_JP_2 }}
        run: python scripts/check_social_accounts.py --language ja

  social-us-read-only:
    needs: safety-tests
    if: inputs.mode == 'social-check' && inputs.market == 'us'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Read US Instagram and TikTok health/capacity only
        env:
          ZERNIO_API_KEY_1: ${{ secrets.ZERNIO_API_KEY_US_1 }}
        run: python scripts/check_social_accounts.py --language en
